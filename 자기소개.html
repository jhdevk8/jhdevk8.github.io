<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <style>
    /* 1. 리셋 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 2. 태그 기본값 */
    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    h1 {
      margin: 0;
      padding: 10px;
      letter-spacing: -0.5px;
      font-size: 27px;
      font-weight: 700;
    }

    img {
      width: 100%;
      height: 100%;
    }

    b {
      background-color: #dbeafe;
      color: #1e3a8a;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* 3. 레이아웃 컨테이너 */
    #intro {
      display: flex;
      flex-direction: column;
      border: 2px solid black;
      width: 50%;
      min-height: 400px;
      margin: 0 auto;
      background-color: lightblue;
    }

    .info_top {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 20px;
    }

    .info_pic {
      width: 200px;
      height: 200px;
      margin-left: 20px;
      margin-top: 20px;
    }

    /* 4. 컴포넌트: 소개글 박스 */
    .info_p {
      line-height: 1.7;
      border: 1px solid blue;
    }

    .info_p p {
      padding: 20px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.8px;
    }

    /* 5. 텍스트 강조 */
    .top_span {
      color: #1a56db;
      text-decoration: none;
    }

    .p_span {
      font-weight: 500;
      text-decoration: underline;
      text-decoration-color: #1a56db;
      text-underline-offset: 4px;
      color: #1e3a8a;
    }
  </style>
  <div id="intro">



    <div class="info_top">
      <div class="info_pic">
        <img src="/pic.jpg" alt="프로필 사진">
      </div>

      <h1>안녕하세요, 프론트엔드 개발자 <span class="top_span">백재현</span>입니다.</h1>

    </div>


    <div class="info_p">
      <p>웹관련 수업에서, 평소 아무렇지 않게 쓰던
        <span class="p_span">웹사이트 뒤에 눈에 보이지 않는 수많은 기술이 숨어있다는 걸 알게 됐습니다.</span>

        그 순간부터 웹이 다르게 보이기 시작했고,
        직접 화면을 만들어보고 싶다는 생각에 프론트엔드 개발에 빠지게 되었습니다.

        현재는 <b>HTML/CSS, JavaScript, React</b>를 중심으로 기본기를 다지며
        포트폴리오 프로젝트를 준비하고 있습니다.</p>
    </div>
  </div>
</body>

</html>
